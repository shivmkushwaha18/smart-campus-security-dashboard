<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Campus Security - Live Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
    <header>
        <h1>🛡️ Smart Campus Security — Live Dashboard</h1>
        <p class="subtitle">Real-time face recognition entry monitoring</p>
    </header>

    <section class="stats-grid">
        <div class="stat-card total">
            <h2 id="stat-total">0</h2>
            <p>Total Scans</p>
        </div>
        <div class="stat-card granted">
            <h2 id="stat-granted">0</h2>
            <p>Access Granted</p>
        </div>
        <div class="stat-card denied">
            <h2 id="stat-denied">0</h2>
            <p>Access Denied</p>
        </div>
    </section>

    <section class="main-grid">
        <div class="panel chart-panel">
            <h3>Granted vs Denied</h3>
            <canvas id="statusChart"></canvas>
        </div>

        <div class="panel feed-panel">
            <h3>Live Entry Feed</h3>
            <table id="feed-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Name</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="feed-body">
                    <!-- rows injected by JS -->
                </tbody>
            </table>
        </div>
    </section>

    <footer>
        <p>Auto-refreshes every {{ refresh_ms // 1000 }} seconds &middot; Engineering Day Demo</p>
    </footer>

    <script>
        const REFRESH_MS = {{ refresh_ms }};
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
